name: Run Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Start test services
        run: docker compose -f docker-compose.test.yaml up -d

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run database migrations
        run: |
          goose -dir internal/storage/postgres/migrations postgres "postgres://postgres:postgres@127.0.0.1:5434/postgres?sslmode=disable" up
          GOOSE_DRIVER=clickhouse GOOSE_DBSTRING="clickhouse://default:default@127.0.0.1:9000/default" goose -dir internal/storage/clickhouse/migrations up

      - name: Run tests with coverage
        env:
          POSTGRES_URL: "postgres://postgres:postgres@127.0.0.1:5434/postgres?sslmode=disable"
          CLICKHOUSE_URL: "127.0.0.1:9000"
          CLICKHOUSE_USERNAME: "default"
          CLICKHOUSE_USER: "default"
          CLICKHOUSE_PASSWORD: "default"
          CLICKHOUSE_DATABASE: "default"
          NATS_STREAM_URL: "nats://127.0.0.1:4222"
          REDIS_ADDRS: "127.0.0.1:6379"
          JWT_SECRET_KEY: "test-secret-key-for-testing-purposes-min-32-chars"
          ENCRYPTION_KEY: "test-encryption-key-must-be-32-chars-long!"
          ZORI_IS_OSS: "true"
          LOG_LEVEL: "error"
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Cleanup test services
        if: always()
        run: docker compose -f docker-compose.test.yaml down -v
