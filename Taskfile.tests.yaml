version: "3"

vars:
  GO_MODULE: zori

tasks:
  test:containers:
    desc: Start test database containers using docker compose
    cmds:
      - docker compose -f docker-compose.test.yaml up -d
      - echo "Waiting for services to be healthy..."

  test:migrate:
    desc: Run migrations for test databases
    dotenv: [".env.test"]
    deps:
      - test:containers
    cmds:
      - goose -dir internal/storage/postgres/migrations postgres "postgres://postgres:postgres@localhost:5434/postgres?sslmode=disable" up
      - GOOSE_DRIVER=clickhouse GOOSE_DBSTRING="tcp://default:default@localhost:9002/default" goose -dir internal/storage/clickhouse/migrations up

  test:cleanup:
    desc: Stop and remove test database containers
    cmds:
      - docker compose -f docker-compose.test.yaml down -v

  test:
    desc: "Run tests (usage: task test -- ./path/to/tests or task test -- -v -run TestName ./path)"
    dotenv: [".env.test"]
    deps:
      - test:migrate
    cmds:
      - go test {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}

  test:coverage:
    desc: Run tests with coverage report
    dotenv: [".env.test"]
    deps:
      - test:migrate
    cmds:
      - go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  test:analytics:tiles:
    desc: Run all tiles tests
    dotenv: [".env.test"]
    deps:
      - test:migrate
    cmds:
      - go test -v ./services/analytics/tiles

  test:verbose:
    desc: Run all tests with verbose output
    dotenv: [".env.test"]
    deps:
      - test:migrate
    cmds:
      - go test -v ./...

  test:watch:
    desc: Run tests in watch mode (requires entr)
    dotenv: [".env.test"]
    cmds:
      - find . -name "*.go" | entr -c go test ./...

  clean:
    desc: Clean build artifacts and temporary files
    cmds:
      - rm -f {{.GO_MODULE}}
      - rm -f coverage.out coverage.html
      - go clean -testcache
