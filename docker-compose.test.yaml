version: '3.8'

services:
  postgres-test:
    image: postgres:latest
    container_name: postgres-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  clickhouse-test:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-test
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    ports:
      - "9002:9000"
      - "8123:8123"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./scripts/clickhouse-users-test.xml:/etc/clickhouse-server/users.d/test.xml
      - clickhouse-test-data:/var/lib/clickhouse

  nats-test:
    image: nats:latest
    container_name: nats-test
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[n]ats-server' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis-test:
    image: redis:latest
    container_name: redis-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - redis-test-data:/data

volumes:
  postgres-test-data:
  clickhouse-test-data:
  redis-test-data:

networks:
  default:
    name: zori-test-network
