version: "3"

dotenv: [".env"]

vars:
  GO_MODULE: zori

tasks:
  server:
    aliases:
      - s
    desc: Start the API HTTP server (default port 1323)
    cmds:
      - go run . server {{.CLI_ARGS}}

  ingestion:
    aliases:
      - i
    desc: Start the Ingestion HTTP server (default port 1324)
    cmds:
      - go run . ingestion {{.CLI_ARGS}}

  migrate:up:
    desc: Run all pending database migrations
    cmds:
      - goose -dir internal/storage/postgres/migrations postgres "$POSTGRES_URL" up
      - GOOSE_DRIVER=clickhouse GOOSE_DBSTRING="clickhouse://$CLICKHOUSE_USERNAME:$CLICKHOUSE_PASSWORD@$CLICKHOUSE_URL" goose -dir internal/storage/clickhouse/migrations up

  migrate:down:
    desc: Rollback the last database migration
    cmds:
      - goose -dir internal/storage/postgres/migrations postgres "$POSTGRES_URL" down
      - GOOSE_DRIVER=clickhouse GOOSE_DBSTRING=$CLICKHOUSE_URL goose -dir internal/storage/clickhouse/migrations down

  docs:
    desc: Generate Swagger documentation
    cmds:
      - npm install -g api-spec-converter
      - swag init -g main.go --parseDependency --parseInternal --parseDepth 2 --parseFuncBody
      - npx api-spec-converter --syntax=json --from=swagger_2 --to=openapi_3 docs/swagger.json > docs/openapi.json
      - npx api-spec-converter --syntax=yaml --from=swagger_2 --to=openapi_3 docs/swagger.yaml > docs/openapi.yaml
      - rm docs/swagger.yaml
      - rm docs/swagger.json
    silent: true

  test:containers:
    desc: Start test database containers
    cmds:
      - docker run --rm -d --name postgres-test -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p 5434:5432 postgres:latest
      - docker run --rm -d --name clickhouse-test -p 9002:9000 -v {{.ROOT_DIR}}/scripts/clickhouse-users-test.xml:/etc/clickhouse-server/users.d/test.xml clickhouse/clickhouse-server:latest
      - docker run --rm -d --name nats-test -p 4222:4222 -p 8222:8222 nats:latest -js
      - docker run --rm -d --name redis-test -p 6379:6379 redis:latest
      - ./scripts/init-test-dbs.sh

  test:migrate:
    desc: Run migrations for test databases
    dotenv: [".env.test"]
    cmds:
      - goose -dir internal/storage/postgres/migrations postgres "postgres://postgres:postgres@localhost:5434/zori_test?sslmode=disable" up
      - GOOSE_DRIVER=clickhouse GOOSE_DBSTRING="tcp://localhost:9002/zori_test" goose -dir internal/storage/clickhouse/migrations up

  test-cleanup:
    desc: Stop and remove test database containers
    cmds:
      - docker stop postgres-test clickhouse-test nats-test redis-test || true
      - docker rm postgres-test clickhouse-test nats-test redis-test || true

  test:
    desc: Run all tests
    dotenv: [".env.test"]
    deps:
      - test:migrate
    cmds:
      # - defer: { task: test-cleanup }
      - go test ./... {{.CLI_ARGS}}

  test:verbose:
    desc: Run all tests with verbose output
    dotenv: [".env.test"]
    cmds:
      - go test -v ./...

  # Clean tasks
  clean:
    desc: Clean build artifacts and temporary files
    cmds:
      - rm -f {{.GO_MODULE}}
      - rm -f coverage.out coverage.html
      - go clean -testcache

  start:
    desc: Quick start - setup environment and run server
    cmds:
      - task: migrate:up
      - task: server
