        '401':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Unauthorized - Invalid or missing JWT token
        '404':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Project not found
        '500':
          content:
            application/json:
              schema:
                additionalProperties: true
