openapi: 3.0.0
info:
  contact:
    email: support@zorihq.com
    name: Zori Support
    url: 'https://www.zorihq.com/support'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
  termsOfService: 'https://swagger.io/terms/'
  title: OpenAPI Specification for Zori server
  version: '1.0'
servers:
  - url: /api/v1
paths:
  /api/v1/analytics/dashboard:
    get:
      parameters:
        - description: Project ID
          in: query
          name: project_id
          required: true
          schema:
            type: string
        - description: Time range
          in: query
          name: time_range
          required: true
          schema:
            enum:
              - last_hour
              - today
              - last_7_days
              - last_30_days
              - last_90_days
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.DashboardMetricsResponse'
          description: Dashboard metrics
        '400':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Invalid request parameters
        '401':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Unauthorized - Invalid or missing JWT token
        '500':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Internal server error
      security:
        - ApiKeyAuth: []
      tags:
        - Analytics
      description: >-
        Get combined key metrics including sessions, active users, bounce rate,
        and retention for dashboard display
      summary: Get dashboard metrics
  /api/v1/analytics/events/recent:
    get:
      parameters:
        - description: Project ID
          in: query
          name: project_id
          required: true
          schema:
            type: string
        - description: 'Maximum number of events to return (default: 15)'
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.RecentEventsResponse'
          description: List of recent events
        '400':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Invalid request parameters
        '401':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Unauthorized - Invalid or missing JWT token
        '500':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Internal server error
      security:
        - ApiKeyAuth: []
      tags:
        - Analytics
      description: 'Get a list of the most recent events (default: 15 events)'
      summary: Get recent events
  /api/v1/analytics/retention/churn-rate:
