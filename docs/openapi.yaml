            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Project with this name already exists
        '500':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Internal server error
      security:
        - ApiKeyAuth: []
      tags:
