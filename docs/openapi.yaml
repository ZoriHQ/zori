        '500':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Internal server error
      tags:
        - Authentication
      description: Authenticate a user with email and password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.LoginRequest'
        description: Login credentials
        required: true
      summary: User login
