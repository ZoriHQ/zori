        - Authentication
      description: Invalidate the current session and refresh token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.LogoutRequest'
        description: Logout request
        required: true
      summary: User logout
  /api/v1/auth/recover:
