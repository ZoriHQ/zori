# yaml-language-server: $schema=https://app.stainless.com/config.schema.json

organization:
  # Name of your organization or company, used to determine the name of the client
  # and headings.
  name: zoriapi
  # Link to your API documentation.
  docs: https://www.zorihq.com/support
  # Contact email for bug reports, questions, and support requests.
  contact: support@zorihq.com

# `targets` define the output targets and their customization options, such as
# whether to emit the Node SDK and what it's package name should be.
targets:
  typescript:
    package_name: zorihq
    production_repo: ZoriHQ/typescript-api-sdk
    publish:
      npm: true

# `environments` are a map of the name of the environment (e.g. "sandbox",
# "production") to the corresponding url to use.
environments:
  production: https://api.zorihq.com/api/v1

# `resources` define the structure and organization for your API, such as how
# methods and models are grouped together and accessed. See the [configuration
# guide] for more information.
#
# [configuration guide]: https://www.stainless.com/docs/guides/configure#resources
resources:
  v1:
    subresources:
      auth:
        models:
          login_request: "#/components/schemas/types.LoginRequest"
          login_response: "#/components/schemas/types.LoginResponse"
        methods:
          login: post /api/v1/auth/login
      analytics:
        models:
          visitor_data_point: "#/components/schemas/types.VisitorDataPoint"
          visitors_by_device_response: "#/components/schemas/types.VisitorsByDeviceResponse"
          recent_event: "#/components/schemas/types.RecentEvent"
          recent_events_response: "#/components/schemas/types.RecentEventsResponse"
          event_filter_options_response: "#/components/schemas/types.EventFilterOptionsResponse"
          top_visitor: "#/components/schemas/types.TopVisitor"
          top_visitors_response: "#/components/schemas/types.TopVisitorsResponse"
          visitor_profile_response: "#/components/schemas/types.VisitorProfileResponse"
          visitor_event: "#/components/schemas/types.VisitorEvent"
          events_over_time_data_point: "#/components/schemas/types.EventsOverTimeDataPoint"
          churn_rate_response: "#/components/schemas/types.ChurnRateResponse"
          cohort_analysis_response: "#/components/schemas/types.CohortAnalysisResponse"
          cohort_data: "#/components/schemas/types.CohortData"
          manual_identify_request: "#/components/schemas/types.ManualIdentifyRequest"
          manual_identify_response: "#/components/schemas/types.ManualIdentifyResponse"
          card_precision: "#/components/schemas/tiles.CardPrecision"
          timeline_tile_data: "#/components/schemas/tiles.TimelineTileData"
          timeline_tile_response: "#/components/schemas/tiles.TimelineTileResponse"
          country_traffic_source_data: "#/components/schemas/tiles.CountryTrafficSourceData"
          country_traffic_source_response: "#/components/schemas/tiles.CountryTrafficSourceResponse"
          referer_traffic_source_data: "#/components/schemas/tiles.RefererTrafficSourceData"
          referer_traffic_source_response: "#/components/schemas/tiles.RefererTrafficSourceResponse"
          unique_visitors_response: "#/components/schemas/tiles.UniqueVisitorsResponse"
          unique_sessions_response: "#/components/schemas/tiles.UniqueSessionsResponse"
          bounce_rate_response: "#/components/schemas/tiles.BounceRateResponse"
          session_duration_response: "#/components/schemas/tiles.SessionDurationResponse"
          pages_per_session_response: "#/components/schemas/tiles.PagesPerSessionResponse"
          dau_response: "#/components/schemas/tiles.DAUResponse"
          wau_response: "#/components/schemas/tiles.WAUResponse"
          mau_response: "#/components/schemas/tiles.MAUResponse"
          utm_traffic_source_response: "#/components/schemas/tiles.UTMTrafficSourceResponse"
          return_rate_response: "#/components/schemas/tiles.ReturnRateResponse"
          time_between_visits_response: "#/components/schemas/tiles.TimeBetweenVisitsResponse"
          visitors_by_os_response: "#/components/schemas/tiles.VisitorsByOSResponse"
          visitors_by_browser_response: "#/components/schemas/tiles.VisitorsByBrowserResponse"
          entry_pages_data: "#/components/schemas/tiles.EntryPagesData"
          entry_pages_response: "#/components/schemas/tiles.EntryPagesResponse"
          exit_pages_data: "#/components/schemas/tiles.ExitPagesData"
          exit_pages_response: "#/components/schemas/tiles.ExitPagesResponse"
          llm_cost_response: "#/components/schemas/tiles.LLMCostResponse"
          llm_model_cost_data: "#/components/schemas/tiles.LLMModelCostData"
          llm_top_models_cost_response: "#/components/schemas/tiles.LLMTopModelsCostResponse"
          llm_trace_item: "#/components/schemas/types.LLMTraceItem"
          llm_traces_list_response: "#/components/schemas/types.LLMTracesListResponse"
          llm_trace_filter_options_response: "#/components/schemas/types.LLMTraceFilterOptionsResponse"
        methods:
          timeline: get /api/v1/analytics/timeline
        subresources:
          visitors:
            methods:
              by_device: get /api/v1/analytics/visitors/device
              top: get /api/v1/analytics/visitors/top
              profile: get /api/v1/analytics/visitors/profile
              identify: post /api/v1/analytics/visitors/identify
          events:
            methods:
              recent: get /api/v1/analytics/events/recent
              filter_options: get /api/v1/analytics/events/filter-options
          llm:
            methods:
              traces: get /api/v1/analytics/llm/traces
              traces_filter_options: get /api/v1/analytics/llm/traces/filter-options
          tiles:
            methods:
              unique_visitors: get /api/v1/analytics/tiles/unique-visitors
              unique_sessions: get /api/v1/analytics/tiles/unique-sessions
              bounce_rate: get /api/v1/analytics/tiles/bounce-rate
              session_duration: get /api/v1/analytics/tiles/session-duration
              pages_per_session: get /api/v1/analytics/tiles/pages-per-session
              dau: get /api/v1/analytics/tiles/dau
              wau: get /api/v1/analytics/tiles/wau
              mau: get /api/v1/analytics/tiles/mau
              return_rate: get /api/v1/analytics/tiles/return-rate
              time_between_visits: get /api/v1/analytics/tiles/time-between-visits
              traffic_by_country: get /api/v1/analytics/tiles/traffic-by-country
              traffic_by_referer: get /api/v1/analytics/tiles/traffic-by-referer
              traffic_by_utm: get /api/v1/analytics/tiles/traffic-by-utm
              visitors_by_browser: get /api/v1/analytics/tiles/visitors-by-browser
              visitors_by_os: get /api/v1/analytics/tiles/visitors-by-os
              entry_pages: get /api/v1/analytics/tiles/entry-pages
              exit_pages: get /api/v1/analytics/tiles/exit-pages
              llm_cost: get /api/v1/analytics/tiles/llm-cost
              llm_top_models_cost: get /api/v1/analytics/tiles/llm-top-models-cost
          retention:
            methods:
              churn_rate: get /api/v1/analytics/retention/churn-rate
              cohorts: get /api/v1/analytics/retention/cohorts
      revenue:
        models:
          dashboard_response: "#/components/schemas/types.DashboardResponse"
          attribution_by_origin_response: "#/components/schemas/types.AttributionByOriginResponse"
          origin_attribution_data_point: "#/components/schemas/types.OriginAttributionDataPoint"
          attribution_by_utm_response: "#/components/schemas/types.AttributionByUTMResponse"
          utm_attribution_data_point: "#/components/schemas/types.UTMAttributionDataPoint"
          timeline_response: "#/components/schemas/types.TimelineResponse"
          timeline_data_point: "#/components/schemas/types.TimelineDataPoint"
          top_customers_response: "#/components/schemas/types.TopCustomersResponse"
          top_customer: "#/components/schemas/types.TopCustomer"
          customer_profile_response: "#/components/schemas/types.CustomerProfileResponse"
          payment: "#/components/schemas/types.Payment"
          revenue_over_time_data_point: "#/components/schemas/types.RevenueOverTimeDataPoint"
          conversion_metrics_response: "#/components/schemas/types.ConversionMetricsResponse"
        methods:
          dashboard: get /api/v1/revenue/dashboard
          timeline: get /api/v1/revenue/timeline
        subresources:
          attribution:
            methods:
              by_origin: get /api/v1/revenue/attribution/origin
              by_utm: get /api/v1/revenue/attribution/utm
          customers:
            methods:
              top: get /api/v1/revenue/customers/top
              profile: get /api/v1/revenue/customers/profile
          conversion:
            methods:
              metrics: get /api/v1/revenue/conversion/metrics
          cohort:
            methods:
              get_metrics: post /api/v1/revenue/cohort/metrics
      projects:
        # Configure the models--named types--defined in the resource. Each key in the
        # object is the name of the model and the value is either the name of a schema in
        # `#/components/schemas` or an object with more detail.
        #
        # [reference]: https://www.stainless.com/docs/reference/config#model
        models:
          project: "#/components/schemas/models.Project"
          project_response: "#/components/schemas/services.ProjectResponse"
          list_projects_response: "#/components/schemas/services.ListProjectsResponse"
          create_project_request: "#/components/schemas/types.CreateProjectRequest"
          update_project_request: "#/components/schemas/types.UpdateProjectRequest"
        # Configure the methods defined in this resource. Each key in the object is the
        # name of the method and the value is either an endpoint (for example, `get /foo`)
        # or an object with more detail.
        #
        # [reference]: https://www.stainless.com/docs/reference/config#method
        methods:
          create: post /api/v1/projects
          list: get /api/v1/projects/list
          get: get /api/v1/projects/{id}
          update: put /api/v1/projects/{id}
          delete: delete /api/v1/projects/{id}
      payment_providers:
        models:
          payment_provider_response: "#/components/schemas/types.PaymentProviderResponse"
          list_payment_providers_response: "#/components/schemas/types.ListPaymentProvidersResponse"
          create_payment_provider_request: "#/components/schemas/types.CreatePaymentProviderRequest"
          update_payment_provider_request: "#/components/schemas/types.UpdatePaymentProviderRequest"
          provider_instructions_response: "#/components/schemas/types.ProviderInstructionsResponse"
          provider_field: "#/components/schemas/types.ProviderField"
        methods:
          create: post /api/v1/payment-providers
          list: get /api/v1/payment-providers
          get: get /api/v1/payment-providers/{id}
          update: put /api/v1/payment-providers/{id}
          delete: delete /api/v1/payment-providers/{id}
          instructions: get /api/v1/payment-providers/instructions
        subresources:
          stripe:
            subresources:
              app:
                methods:
                  handle_callback: get /api/v1/payment-providers/stripe/app/callback

settings:
  # All generated integration tests that hit the prism mock http server are marked
  # as skipped. Removing this setting or setting it to false enables tests, but
  # doing so may result in test failures due to bugs in the test server.
  #
  # [prism mock http server]: https://stoplight.io/open-source/prism
  disable_mock_tests: true
  license: Apache-2.0

# `client_settings` define settings for the API client, such as extra constructor
# arguments (used for authentication), retry behavior, idempotency, etc.
client_settings:
  opts:
    api_key:
      type: string
      nullable: true
      auth:
        security_scheme: ApiKeyAuth
      read_env: ZORIAPI_API_KEY

security:
  - ApiKeyAuth: []

# `readme` is used to configure the code snippets that will be rendered in the
# README.md of various SDKs. In particular, you can change the `headline`
# snippet's endpoint and the arguments to call it with.
readme:
  example_requests:
    default:
      type: request
      endpoint: post /api/v1/auth/login
      params: {}
    headline:
      type: request
      endpoint: post /api/v1/auth/login
      params: {}
